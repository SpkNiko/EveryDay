<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171426">
  <meta name="description" content="EVERYDAY — Twoje codzienne centrum organizacji.">
  <title>EVERYDAY</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span>EVERYDAY</span>
    </div>
    <button id="themeButton" class="icon-button" aria-label="Zmień motyw">☀</button>
  </header>

  <main class="container">
    <section class="welcome">
      <p class="eyebrow">TWOJE CODZIENNE CENTRUM</p>
      <h1>Witaj! 👋</h1>
      <p>Ogarnij swój dzień w jednym miejscu.</p>
    </section>

    <section class="stats">
      <article class="stat-card">
        <span>Do zrobienia</span>
        <strong id="taskCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Przypomnienia</span>
        <strong id="reminderCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Notatki</span>
        <strong id="noteCount">0</strong>
      </article>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="tasks">Zadania</button>
      <button class="tab" data-tab="reminders">Przypomnienia</button>
      <button class="tab" data-tab="notes">Notatki</button>
    </nav>

    <section id="tasks" class="panel active">
      <h2>Twoje zadania</h2>
      <form id="taskForm" class="form">
        <input id="taskInput" placeholder="Co masz do zrobienia?" required maxlength="120">
        <button type="submit">Dodaj</button>
      </form>
      <ul id="taskList" class="item-list"></ul>
    </section>

    <section id="reminders" class="panel">
      <h2>Przypomnienia</h2>
      <form id="reminderForm" class="form vertical">
        <input id="reminderInput" placeholder="Nazwa przypomnienia" required maxlength="120">
        <label for="reminderDate">Data i godzina</label>
        <input id="reminderDate" type="datetime-local" required>
        <button type="submit">Ustaw przypomnienie</button>
      </form>
      <button id="notificationButton" class="secondary-button">
        Włącz powiadomienia
      </button>
      <ul id="reminderList" class="item-list"></ul>
    </section>

    <section id="notes" class="panel">
      <h2>Twoje notatki</h2>
      <form id="noteForm" class="form vertical">
        <input id="noteTitle" placeholder="Tytuł notatki" required maxlength="80">
        <textarea id="noteContent" placeholder="Treść notatki..." required></textarea>
        <button type="submit">Zapisz notatkę</button>
      </form>
      <div id="noteList" class="note-list"></div>
    </section>

    <footer>
      <p>EVERYDAY • Twoje życie, lepsza organizacja.</p>
      <small>Wersja 1.0</small>
    </footer>
  </main>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
